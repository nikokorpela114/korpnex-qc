<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Korpnex Työnjohto" id="apple-title-meta">
  <meta name="theme-color" content="#070b17">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!--
    HUOM (korjattu bugi — "Lisää Koti-valikkoon" avasi aina Työnjohto-appin):
    tämä on TYÖNJOHDON oma index.html, osoitteessa "/". Valvomolla ja
    Asentajalla on OMAT, tähän nähden erilliset index.html-tiedostonsa
    (valvomo/index.html, asentaja/index.html — ks. niiden omat HUOM-kommentit
    ja vite.config.js), koska iOS Safarin "Lisää Koti-valikkoon" lukee
    kotikuvakkeen kohteen/nimen suoraan PALVELIMEN TARJOAMASTA HTML:stä eikä
    JavaScriptin ajonaikaisesti muokkaamasta versiosta — kolmen näkymän
    jakama YKSI staattinen tiedosto (erotellun vain ?query-parametrilla) ei
    siis RIITTÄNYT korjaukseksi, vaikka manifest-linkki olisi vaihdettu JS:llä.
    src/main.jsx:n ajonaikainen vaihto on silti jätetty varmuuden vuoksi
    (esim. vanhojen ?asentaja/?valvomo-linkkien varalta).
  -->
  <link rel="manifest" href="/manifest-tyonjohto.json" id="app-manifest">
  <title>Korpnex Työnjohto</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
